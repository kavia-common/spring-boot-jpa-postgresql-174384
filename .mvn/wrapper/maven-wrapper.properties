# Maven Wrapper configuration
# Pin the Maven distribution to a stable version for reproducible builds.
# This allows running './mvnw' without a global Maven installation.
distributionUrl=https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.6/apache-maven-3.9.6-bin.zip

# Optional: Repository URL for the wrapper JAR (kept for compatibility with older scripts)
wrapperUrl=https://repo.maven.apache.org/maven2/io/takari/maven-wrapper/0.5.6/maven-wrapper-0.5.6.jar
